name: Build KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@v7
      with:
        root-reserve-mb: 8192
        temp-reserve-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Download Clang
      run: |
        mkdir -p $GITHUB_WORKSPACE/clang
        cd $GITHUB_WORKSPACE/clang
        curl -LO "https://googlesource.com"
        tar -xf clang-r450784d.tar.gz

    - name: Clone Kernel Source
      run: |
        git clone --depth=1 -b lineage-20 https://github.com $GITHUB_WORKSPACE/kernel

    - name: Integrate KernelSU
      run: |
        cd $GITHUB_WORKSPACE/kernel
        curl -LSs "https://githubusercontent.com" | bash -

    - name: Update Defconfig for KernelSU
      run: |
        cd $GITHUB_WORKSPACE/kernel
        echo "CONFIG_MODULES=y" >> arch/arm64/configs/vendor/rosemary_defconfig
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/vendor/rosemary_defconfig
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/vendor/rosemary_defconfig
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/vendor/rosemary_defconfig

    - name: Build Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        make O=out vendor/rosemary_defconfig
        make O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- -j$(nproc)

    - name: Pack with AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE
        git clone https://github.com
        cp kernel/out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 ../AnyKernel3-KernelSU-rosemary.zip *

    - name: Upload Finished Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Finished-KernelSU-Kernel
        path: AnyKernel3-KernelSU-rosemary.zip


